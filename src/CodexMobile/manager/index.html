<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 接入管理 · Dock</title><link rel="stylesheet" href="vendor/account.css"><link rel="stylesheet" href="app.css"></head>
<body><main><header><div><small>CODEX DOCK · 本机管理</small><h1>连接与接入</h1></div><button id="refresh" type="button">刷新状态</button></header><p id="status" role="status">正在验证本机授权…</p><div id="content" hidden>
<section class="current-summary" aria-labelledby="current-title"><h2 id="current-title">当前接入</h2><p id="current-access" role="status">正在读取…</p><p>此电脑的 Desktop 与 CLI 共用配置。切换前请结束任务；需要重启时会先征求确认。WSL 使用独立配置。</p></section>
<nav class="manager-tabs" aria-label="接入管理分类" role="tablist"><button id="tab-saved" type="button" data-tab="saved" role="tab" aria-selected="true" aria-controls="panel-saved">已保存接入</button><button id="tab-api" type="button" data-tab="api" role="tab" aria-selected="false" aria-controls="panel-api" tabindex="-1">新增 / 编辑 API</button><button id="tab-environments" type="button" data-tab="environments" role="tab" aria-selected="false" aria-controls="panel-environments" tabindex="-1">应用与 WSL</button></nav>
<div id="cli-feedback"></div>
<div id="panel-saved" role="tabpanel" aria-labelledby="tab-saved"><section id="accounts"></section><section id="cli-saved"><h2>API 与原生配置</h2><p class="scope">本机 Desktop / CLI</p><div id="cli-rows"></div><button id="add-api" class="primary" type="button">新增 API 接入</button></section></div>
<section id="panel-api" role="tabpanel" aria-labelledby="tab-api" hidden><h2>API 接入编辑</h2><p class="scope">保存接入与切换当前配置分别执行。API Key 默认隐藏；模型可手动填写。</p><div id="cli"></div></section>
<section id="panel-environments" role="tabpanel" aria-labelledby="tab-environments" hidden><h2>应用与 WSL</h2><p class="scope">只影响当前电脑；WSL 操作只影响所选发行版。</p><div id="clients" role="status"></div><label id="wsl-label" hidden>WSL 环境<select id="wsl-entry"><option value="">请选择</option></select></label><div id="wsl"></div></section>
</div></main><script src="vendor/i18n.js"></script><script src="vendor/account.js"></script><script src="vendor/accounts.js"></script><script src="vendor/cli-access.js"></script><script src="vendor/wsl-accounts.js"></script><script src="app.js"></script></body></html>
