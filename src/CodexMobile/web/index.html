<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Codex Dock · 手机连接</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login" class="login-card" aria-labelledby="login-title">
    <div class="brand">CODEX DOCK</div>
    <h1 id="login-title">连接电脑上的 Codex</h1>
    <p>使用电脑「手机连接」页面设置的账号和密码，或在安卓 App 扫描配对码。</p>
    <form id="login-form">
      <label>账号<input id="username" name="username" autocomplete="username" required maxlength="200"></label>
      <label>访问密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000"></label>
      <button id="login-button" class="primary" type="submit">登录</button>
    </form>
    <p id="login-status" role="status" aria-live="polite">正在检查连接…</p>
  </section>
  <main id="app" hidden>
    <aside id="sidebar">
      <header class="list-heading"><div id="connected-computer"><div class="brand">CODEX DOCK</div><strong id="computer-name">本机 Codex</strong></div><button id="logout" class="quiet">退出登录</button></header>
      <form id="search-form" role="search"><input id="search" placeholder="搜索已有聊天" aria-label="搜索聊天" maxlength="200"><button type="submit">搜索</button></form>
      <div id="list-status" role="status"></div>
      <nav id="sessions" class="client-navigation" aria-label="已有聊天"></nav>
      <button id="more" class="quiet" hidden>加载更多</button>
      <footer class="sidebar-foot client-functions">仅支持本机 Codex App 已有聊天。<a href="codexbridge://home">返回电脑列表</a></footer>
    </aside>
    <section id="chat" aria-label="聊天">
      <header class="chat-header chat-head"><button id="back" class="quiet">返回</button><div><strong id="chat-title">选择一个聊天</strong><div id="chat-meta"></div></div><button id="refresh" class="quiet">刷新</button></header>
      <div id="timeline" aria-live="off"><p class="empty">在电脑打开 Codex App，然后选择左侧已有聊天。</p></div>
      <div id="approvals" aria-live="polite"></div>
      <div id="operation-warning" role="status" hidden><span id="operation-message"></span><button id="acknowledge" class="quiet">已核对结果，允许新操作</button></div>
      <form id="composer">
        <textarea id="message" rows="3" placeholder="输入消息" aria-label="消息" maxlength="100000" disabled></textarea>
        <div class="composer-actions"><span id="chat-status" role="status">尚未选择聊天</span><button id="stop" type="button" hidden>停止任务</button><button id="steer" type="button" hidden>补充消息</button><button id="send" class="primary" type="submit" disabled>发送</button></div>
      </form>
    </section>
  </main>
</body>
</html>
